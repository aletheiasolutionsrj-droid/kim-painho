services:

  # ============================================================
  # SERVIÇO 1: BANCO DE DADOS VETORIAL - QDRANT
  # ============================================================
  vector_db:
    image: qdrant/qdrant:latest
    container_name: qdrant_container

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage
      - ./backups/acervos:/qdrant/backups/acervos
      - ./backups/acervos:/qdrant/snapshots/acervos

    networks:
      - acervo_network

    restart: unless-stopped


  # ============================================================
  # SERVIÇO 2: OLLAMA
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_container

    ports:
      - "11434:11434"

    environment:
      # Modelos de embedding a baixar (separados por espaço). Veja .env.example
      MODELOS_OLLAMA: ${MODELOS_OLLAMA:-nomic-embed-text bge-m3}

    volumes:
      - ollama_data:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh:ro

    networks:
      - acervo_network

    restart: unless-stopped

    entrypoint: ["/bin/sh", "/entrypoint.sh"]


  # ============================================================
  # SERVIÇO 3: APLICAÇÃO WEB - STREAMLIT
  # ============================================================
  web_app:
    build: .
    container_name: omniarquivo_app

    ports:
      - "8501:8501"

    environment:
      QDRANT_HOST: vector_db
      GROQ_API_KEY: ${GROQ_API_KEY}
      OLLAMA_HOST: http://ollama:11434
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: 2048
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-}

    volumes:
      - .:/app
      - ./documentos_pdf:/app/documentos_pdf

    networks:
      - acervo_network

    depends_on:
      - vector_db
      - ollama

    restart: always


# ============================================================
# REDE
# ============================================================
networks:
  acervo_network:
    driver: bridge


# ============================================================
# VOLUMES
# ============================================================
volumes:

  qdrant_data:
    name: iakimpaim_qdrant_data

  ollama_data:
    name: iakimpaim_ollama_data
