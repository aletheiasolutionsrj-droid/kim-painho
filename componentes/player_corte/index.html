<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player de corte</title>
<style>
:root{--bg:#ffffff;--txt:#262730;--sec:#f0f2f6;--prim:#ff4b4b;--borda:rgba(128,128,128,.40);--reg:rgba(255,75,75,.25)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:var(--txt);
  font-family:"Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
#app{padding:2px 2px 6px}
#wrap{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden}
#player,#wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
#aviso{display:none;margin:8px 0;padding:8px 10px;border-radius:6px;background:rgba(255,170,0,.15);
  border:1px solid rgba(255,170,0,.55)}
#aviso a{color:inherit;font-weight:600}
.linha{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.b{appearance:none;border:1px solid var(--borda);background:var(--sec);color:var(--txt);border-radius:6px;
  padding:6px 10px;font:inherit;cursor:pointer;line-height:1.1;white-space:nowrap}
.b:hover:not(:disabled){border-color:var(--prim)}
.b:disabled{opacity:.45;cursor:default}
.b.p{background:var(--prim);border-color:var(--prim);color:#fff}
.b.s{padding:6px 7px}
select,input[type=text]{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--borda);
  border-radius:6px;padding:5px 6px}
input[type=text]{width:92px;text-align:center;font-variant-numeric:tabular-nums}
input.ruim{border-color:#d33;background:rgba(220,50,50,.12)}
.sep{flex:1}
.tempo{font-variant-numeric:tabular-nums;opacity:.85}
#tlwrap{position:relative;height:62px;margin:16px 10px 4px;user-select:none;-webkit-user-select:none}
#bar{position:absolute;left:0;right:0;top:18px;height:16px;background:var(--sec);border:1px solid var(--borda);
  border-radius:8px;cursor:pointer;touch-action:none}
#reg{position:absolute;top:-1px;bottom:-1px;background:var(--reg);border-top:2px solid var(--prim);
  border-bottom:2px solid var(--prim);cursor:grab;touch-action:none}
#reg:active{cursor:grabbing}
.h{position:absolute;top:-9px;width:16px;height:34px;margin-left:-8px;background:var(--prim);border-radius:5px;
  cursor:ew-resize;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.h::after{content:"";position:absolute;left:7px;top:9px;width:2px;height:16px;background:rgba(255,255,255,.85);
  box-shadow:-3px 0 0 rgba(255,255,255,.0)}
#hi{border-top-left-radius:9px;border-bottom-left-radius:9px}
#hf{border-top-right-radius:9px;border-bottom-right-radius:9px}
#cab{position:absolute;top:-8px;bottom:-8px;width:2px;margin-left:-1px;background:var(--txt);pointer-events:none}
#cab::before{content:"";position:absolute;top:-4px;left:-4px;border:5px solid transparent;border-top-color:var(--txt)}
#ticks{position:absolute;left:0;right:0;top:42px;height:16px;font-size:11px;opacity:.7;pointer-events:none}
#ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.grupo{display:flex;align-items:center;gap:4px}
.rot{font-weight:600}
label.chk{display:flex;align-items:center;gap:4px;cursor:pointer}
.dica{font-size:12px;opacity:.7;margin:2px 0 0}
</style>
</head>
<body>
<div id="app">
  <div id="wrap"><div id="player"></div></div>
  <div id="aviso"></div>

  <div class="linha" id="transporte">
    <button class="b s" id="b-m10" title="Voltar 10 s">⏪ 10s</button>
    <button class="b s" id="b-m1" title="Voltar 1 s">◀ 1s</button>
    <button class="b" id="b-play">▶ Tocar</button>
    <button class="b s" id="b-p1" title="Avançar 1 s">1s ▶</button>
    <button class="b s" id="b-p10" title="Avançar 10 s">10s ⏩</button>
    <span class="sep"></span>
    <span class="tempo" id="tempo">0:00.0 / 0:00.0</span>
    <select id="vel" title="Velocidade">
      <option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1" selected>1×</option>
      <option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option>
    </select>
  </div>

  <div id="tlwrap">
    <div id="bar">
      <div id="reg" title="Arraste para mover o trecho inteiro"></div>
      <div class="h" id="hi" title="Início do corte"></div>
      <div class="h" id="hf" title="Fim do corte"></div>
      <div id="cab"></div>
    </div>
    <div id="ticks"></div>
  </div>

  <div class="linha">
    <button class="b" id="m-ini" title="Usa a posição atual do vídeo como início">📍 Marcar início aqui</button>
    <button class="b" id="m-fim" title="Usa a posição atual do vídeo como fim">📍 Marcar fim aqui</button>
    <span class="sep"></span>
    <button class="b" id="z-in">🔍 Ampliar ao trecho</button>
    <button class="b" id="z-out">↔ Vídeo todo</button>
  </div>

  <div class="linha">
    <div class="grupo"><span class="rot">Início</span>
      <button class="b s" id="i-m1">−1s</button><input type="text" id="t-ini" autocomplete="off"><button class="b s" id="i-p1">+1s</button></div>
    <div class="grupo"><span class="rot">Fim</span>
      <button class="b s" id="f-m1">−1s</button><input type="text" id="t-fim" autocomplete="off"><button class="b s" id="f-p1">+1s</button></div>
    <span class="tempo" id="dur-corte"></span>
  </div>

  <div class="linha">
    <button class="b p" id="p-trecho">▶ Tocar o trecho</button>
    <button class="b" id="p-fim" title="Ouve só os últimos 3 s, para conferir onde o corte termina">⏭ Ouvir o fim</button>
    <label class="chk"><input type="checkbox" id="loop"> repetir</label>
  </div>
  <p class="dica">Arraste as alças vermelhas para ajustar o início e o fim, ou a faixa para movê-la. Os tempos aceitam <b>mm:ss</b>, <b>h:mm:ss</b> ou segundos.</p>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const S = {
  chave: null, video: null, dur: 0, estimada: 0, ini: 0, fim: 60, vi: 0, vf: 0, atual: 0,
  limite: null, loop: false, player: null, pronto: false, erro: false, arr: null, ultimoSeek: 0
};
const fila = [];

// ---------- protocolo do Streamlit (componente sem build) ----------
function enviar(tipo, dados) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tipo }, dados), "*");
}
function altura() {
  enviar("streamlit:setFrameHeight", { height: Math.ceil(document.documentElement.scrollHeight) + 4 });
}
function emitir() {
  enviar("streamlit:setComponentValue", {
    value: { inicio: S.ini, fim: S.fim, duracao_video: S.dur || null, chave: S.chave },
    dataType: "json"
  });
}
window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  aplicarTema(e.data.theme);
  if (e.data.args && e.data.args.chave !== S.chave) iniciar(e.data.args);
});
function aplicarTema(t) {
  if (!t) return;
  const r = document.documentElement.style;
  if (t.textColor) r.setProperty("--txt", t.textColor);
  if (t.backgroundColor) r.setProperty("--bg", t.backgroundColor);
  if (t.secondaryBackgroundColor) r.setProperty("--sec", t.secondaryBackgroundColor);
  if (t.primaryColor) { r.setProperty("--prim", t.primaryColor); r.setProperty("--reg", t.primaryColor + "40"); }
  if (t.font) document.body.style.fontFamily = t.font;
}

// ---------- tempo ----------
const r1 = x => Math.round(x * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function fmt(t) {
  const d = Math.round(Math.max(0, t) * 10);
  const h = Math.floor(d / 36000), m = Math.floor(d % 36000 / 600), s = Math.floor(d % 600 / 10), x = d % 10;
  const p2 = n => String(n).padStart(2, "0");
  return h ? `${h}:${p2(m)}:${p2(s)}.${x}` : `${m}:${p2(s)}.${x}`;
}
function interpretar(txt) {
  txt = String(txt || "").trim().replace(",", ".");
  if (!/^\d+(:\d{1,2}){0,2}(\.\d+)?$/.test(txt)) return null;
  return txt.split(":").reduce((acc, p) => acc * 60 + parseFloat(p), 0);
}
const limiteDur = () => S.dur || S.estimada || Infinity;

// ---------- desenho ----------
function pct(t) {
  const v = S.vf - S.vi;
  return v > 0 ? clamp((t - S.vi) / v, 0, 1) * 100 : 0;
}
function tempoDoX(clientX) {
  const r = $("bar").getBoundingClientRect();
  return S.vi + clamp((clientX - r.left) / r.width, 0, 1) * (S.vf - S.vi);
}
function desenharPlayhead() {
  $("cab").style.left = pct(S.atual) + "%";
  $("tempo").textContent = `${fmt(S.atual)} / ${S.dur || S.estimada ? fmt(S.dur || S.estimada) : "—"}`;
}
function desenhar() {
  const total = S.dur || S.estimada;
  if (!(S.vf > S.vi)) { S.vi = 0; S.vf = total || Math.max(S.fim + 30, 60); }

  $("reg").style.left = pct(S.ini) + "%";
  $("reg").style.width = (pct(S.fim) - pct(S.ini)) + "%";
  $("hi").style.left = pct(S.ini) + "%";
  $("hf").style.left = pct(S.fim) + "%";

  if (document.activeElement !== $("t-ini")) $("t-ini").value = fmt(S.ini);
  if (document.activeElement !== $("t-fim")) $("t-fim").value = fmt(S.fim);
  $("dur-corte").textContent = `Duração do corte: ${fmt(S.fim - S.ini)}`;

  const marcas = $("ticks");
  marcas.innerHTML = "";
  for (let i = 0; i <= 5; i++) {
    const t = S.vi + (S.vf - S.vi) * i / 5;
    const s = document.createElement("span");
    s.style.left = (i * 20) + "%";
    s.textContent = fmt(t).replace(/\.0$/, "");
    marcas.appendChild(s);
  }
  desenharPlayhead();
  altura();
}

// ---------- ações ----------
function seek(t) {
  t = clamp(t, 0, limiteDur());
  S.atual = t;
  if (S.player && S.pronto) { try { S.player.seekTo(t, true); } catch (e) {} }
  desenharPlayhead();
}
function seekLimitado(t) {
  const agora = Date.now();
  if (agora - S.ultimoSeek > 120) { S.ultimoSeek = agora; seek(t); } else { S.atual = t; desenharPlayhead(); }
}
function tocar() { if (S.player && S.pronto) S.player.playVideo(); }
function pausar() { if (S.player && S.pronto) S.player.pauseVideo(); }

function definirIni(v, aoMarcar) {
  S.ini = r1(clamp(v, 0, limiteDur()));
  if (S.ini >= S.fim) S.fim = r1(Math.min(limiteDur(), S.ini + 5));
  if (S.ini >= S.fim) S.ini = r1(Math.max(0, S.fim - 0.5));
  desenhar(); emitir();
  if (aoMarcar) seek(S.ini);
}
function definirFim(v, aoMarcar) {
  S.fim = r1(clamp(v, 0, limiteDur()));
  if (S.fim <= S.ini) S.ini = r1(Math.max(0, S.fim - 5));
  if (S.fim <= S.ini) S.fim = r1(S.ini + 0.5);
  desenhar(); emitir();
  if (aoMarcar) seek(S.fim);
}
function tocarTrecho() {
  S.limite = S.fim; seek(S.ini); tocar();
}
function ouvirFim() {
  S.limite = S.fim; seek(Math.max(S.ini, S.fim - 3)); tocar();
}
function ampliar() {
  const pad = Math.max(15, (S.fim - S.ini) * 0.25);
  S.vi = Math.max(0, S.ini - pad);
  S.vf = Math.min(limiteDur() === Infinity ? S.fim + pad : limiteDur(), S.fim + pad);
  desenhar();
}
function videoTodo() { S.vi = 0; S.vf = S.dur || S.estimada || Math.max(S.fim + 30, 60); desenhar(); }

function relativo(d) { S.limite = null; seek(S.atual + d); }

// ---------- arrastar alças e faixa ----------
const barra = $("bar");
barra.addEventListener("pointerdown", e => {
  const t = tempoDoX(e.clientX);
  if (e.target.id === "hi") S.arr = { tipo: "ini" };
  else if (e.target.id === "hf") S.arr = { tipo: "fim" };
  else if (e.target.id === "reg") S.arr = { tipo: "reg", desvio: t - S.ini, tamanho: S.fim - S.ini };
  else { S.limite = null; seek(t); return; }
  barra.setPointerCapture(e.pointerId);
  e.preventDefault();
});
barra.addEventListener("pointermove", e => {
  if (!S.arr) return;
  const t = tempoDoX(e.clientX), lim = limiteDur();
  if (S.arr.tipo === "ini") {
    S.ini = r1(clamp(t, 0, S.fim - 0.5)); seekLimitado(S.ini);
  } else if (S.arr.tipo === "fim") {
    S.fim = r1(clamp(t, S.ini + 0.5, lim)); seekLimitado(S.fim);
  } else {
    const ini = clamp(t - S.arr.desvio, 0, Math.max(0, lim - S.arr.tamanho));
    S.ini = r1(ini); S.fim = r1(ini + S.arr.tamanho); seekLimitado(S.ini);
  }
  desenhar();
});
function soltar() { if (S.arr) { const tipo = S.arr.tipo; S.arr = null; seek(tipo === "fim" ? S.fim : S.ini); emitir(); } }
barra.addEventListener("pointerup", soltar);
barra.addEventListener("pointercancel", soltar);

// ---------- botões e campos ----------
$("b-m10").onclick = () => relativo(-10);
$("b-m1").onclick = () => relativo(-1);
$("b-p1").onclick = () => relativo(1);
$("b-p10").onclick = () => relativo(10);
$("b-play").onclick = () => {
  S.limite = null;
  if (!S.player || !S.pronto) return;
  S.player.getPlayerState() === 1 ? pausar() : tocar();
};
$("m-ini").onclick = () => definirIni(S.atual, false);
$("m-fim").onclick = () => definirFim(S.atual, false);
$("i-m1").onclick = () => definirIni(S.ini - 1, true);
$("i-p1").onclick = () => definirIni(S.ini + 1, true);
$("f-m1").onclick = () => definirFim(S.fim - 1, true);
$("f-p1").onclick = () => definirFim(S.fim + 1, true);
$("p-trecho").onclick = tocarTrecho;
$("p-fim").onclick = ouvirFim;
$("z-in").onclick = ampliar;
$("z-out").onclick = videoTodo;
$("loop").onchange = e => { S.loop = e.target.checked; };
$("vel").onchange = e => { if (S.player && S.pronto) S.player.setPlaybackRate(parseFloat(e.target.value)); };

function campo(id, aoValidar) {
  const el = $(id);
  const aplicar = () => {
    const v = interpretar(el.value);
    if (v === null) { el.classList.add("ruim"); setTimeout(() => { el.classList.remove("ruim"); desenhar(); }, 900); return; }
    el.classList.remove("ruim");
    aoValidar(v);
  };
  el.addEventListener("change", aplicar);
  el.addEventListener("keydown", e => { if (e.key === "Enter") el.blur(); });      // o blur dispara o "change"
}
campo("t-ini", v => definirIni(v, true));
campo("t-fim", v => definirFim(v, true));

// ---------- player do YouTube ----------
function avisar(html) { const a = $("aviso"); a.innerHTML = html; a.style.display = html ? "block" : "none"; altura(); }

function comAPI(fn) {
  if (window.YT && window.YT.Player) { fn(); return; }
  fila.push(fn);
  if (!document.getElementById("ytapi")) {
    const s = document.createElement("script");
    s.id = "ytapi"; s.src = "https://www.youtube.com/iframe_api";
    s.onerror = () => falhou("Não foi possível carregar o player do YouTube (sem internet?).");
    document.head.appendChild(s);
  }
}
window.onYouTubeIframeAPIReady = () => { fila.splice(0).forEach(f => f()); };

function falhou(msg) {
  S.erro = true;
  avisar(`${msg} Você ainda pode digitar os tempos e exportar o corte. ` +
         `<a href="https://www.youtube.com/watch?v=${S.video}&t=${Math.floor(S.ini)}s" target="_blank" rel="noopener">Abrir no YouTube</a>`);
}

function criarPlayer() {
  S.player = new YT.Player("player", {
    videoId: S.video,
    playerVars: { start: Math.floor(S.ini), rel: 0, modestbranding: 1, playsinline: 1, origin: location.origin },
    events: {
      onReady: ev => {
        S.pronto = true;
        const d = ev.target.getDuration();
        if (d > 0) definirDuracao(d);
      },
      onStateChange: ev => { $("b-play").textContent = ev.data === 1 ? "⏸ Pausar" : "▶ Tocar"; },
      onError: ev => falhou(`O YouTube não deixou abrir este vídeo aqui (erro ${ev.data}).`)
    }
  });
}

function definirDuracao(d) {
  S.dur = d;
  const vistoTudo = S.vi === 0 && (S.vf === 0 || S.vf >= (S.estimada || 0));
  if (S.fim > d) S.fim = r1(d);
  if (S.ini >= S.fim) S.ini = r1(Math.max(0, S.fim - 5));
  if (vistoTudo) { S.vi = 0; S.vf = d; }
  desenhar();
}

function iniciar(a) {
  S.chave = a.chave; S.video = a.video_id; S.erro = false; S.pronto = false; S.dur = 0;
  S.estimada = a.duracao_estimada || 0; S.limite = null; S.vi = 0; S.vf = 0; S.atual = 0;
  const m = a.marcas || {};
  S.ini = r1(m.inicio != null ? m.inicio : (a.posicao || 0));
  S.fim = r1(m.fim != null ? m.fim : S.ini + (a.duracao_inicial || 60));
  S.atual = S.ini;
  avisar("");
  desenhar();
  comAPI(() => {
    if (S.player) { S.player.destroy(); const alvo = document.createElement("div"); alvo.id = "player"; $("wrap").appendChild(alvo); }
    criarPlayer();
  });
}

// ---------- laço de leitura do player ----------
setInterval(() => {
  if (S.player && S.pronto && !S.arr) {
    try {
      S.atual = S.player.getCurrentTime() || 0;
      if (!S.dur) { const d = S.player.getDuration(); if (d > 0) definirDuracao(d); }
    } catch (e) {}

    if (S.limite != null && S.atual >= S.limite - 0.05) {
      if (S.loop) { seek(S.ini); } else { pausar(); S.limite = null; seek(S.fim); }
    }
  }
  desenharPlayhead();
}, 100);

new ResizeObserver(altura).observe(document.body);
enviar("streamlit:componentReady", { apiVersion: 1 });
altura();
</script>
</body>
</html>
